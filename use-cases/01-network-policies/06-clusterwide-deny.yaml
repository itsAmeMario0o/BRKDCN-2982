# A portable guardrail, cluster-wide: deny egress to the link-local metadata
# address 169.254.169.254, which many platforms expose to a workload for
# instance data and short-lived credentials. Blocking it stops a compromised
# pod from reaching it through a server-side request forgery.
#
# IMPORTANT, read before you reuse this. An empty endpointSelector selects
# every pod in every namespace, and in Cilium a selected endpoint with ANY
# egress rule, including an egressDeny, switches to default-deny egress. A bare
# egressDeny here would therefore cut off ALL egress for the whole cluster,
# including CoreDNS reaching the kube-apiserver, and take DNS down cluster-wide.
# To keep this a targeted guardrail and not an outage, pair the deny with an
# explicit allow-all egress: the deny still wins for the metadata CIDR, so the
# net effect is "allow everything except the metadata address".
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-metadata-egress
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - all
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
