# Device-direct NX-OS inventory. Hosts are placeholders (the reference design);
# the operator supplies real endpoints by passing their own inventory with -i.
# Credentials come from the environment, never a file:
#   export NXOS_PASSWORD="$LAB_PASSWORD"
all:
  vars:
    ansible_connection: ansible.netcommon.httpapi
    ansible_network_os: cisco.nxos.nxos
    ansible_user: admin
    ansible_password: "{{ lookup('env', 'NXOS_PASSWORD') }}"
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: false
    ansible_httpapi_port: 443
  children:
    spines:
      hosts:
        spine1: {ansible_host: spine1.fabric.example}
        spine2: {ansible_host: spine2.fabric.example}
    leaves:
      hosts:
        leaf1: {ansible_host: leaf1.fabric.example}
        leaf2: {ansible_host: leaf2.fabric.example}
        leaf3: {ansible_host: leaf3.fabric.example}
        leaf4: {ansible_host: leaf4.fabric.example}
