# NX-OS single-AS (65400) iBGP underlay for the cilium-evpn fabric.
# Design: BRKDCN-2982 single-AS model. iBGP ipv4 over the P2P links, spines as
# route-reflectors. Leaves advertise their loopbacks; the SPINES also advertise
# their connected P2P /31s so a leaf can resolve another leaf's loopback next
# hop (the reflected loopback keeps the originating leaf's P2P next hop, and
# next-hop-self is ignored on reflected routes - so we make the transit links
# routable instead). No eBGP knobs. Overlay (l2vpn evpn, iBGP RR) and the
# Cilium eBGP host peering are Ansible's job. Schema: netascode nac-nxos v0.3.x.
# Slice 1 added: PIM sparse-mode, anycast-RP (loopback254), VTEP anycast
# secondary on loopback1, and the matching BGP networks. nac-nxos v0.3.x.
nxos:
  devices:
  - name: spine1
    configuration:
      feature:
        bgp: true
        pim: true
      interfaces:
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.1/32
          pim:
            sparse_mode: true
        - id: 254
          ip:
            address: 10.254.254.254/32
          pim:
            sparse_mode: true
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.0/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.2/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/3
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.4/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/4
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.6/31
          pim:
            sparse_mode: true
          mtu: 9216
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.1
          address_families:
          - address_family: ipv4-unicast
            networks:
            - prefix: 10.0.0.1/32
            - prefix: 10.1.1.0/31
            - prefix: 10.1.1.2/31
            - prefix: 10.1.1.4/31
            - prefix: 10.1.1.6/31
            - prefix: 10.254.254.254/32
          neighbors:
          - ip: 10.1.1.1
            remote_as: '65400'
            description: leaf1
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.1.3
            remote_as: '65400'
            description: leaf2
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.1.5
            remote_as: '65400'
            description: leaf3
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.1.7
            remote_as: '65400'
            description: leaf4
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
          anycast_rps:
          - address: 10.254.254.254
            set_address: 10.0.0.1
          - address: 10.254.254.254
            set_address: 10.0.0.2
