      vpc:
        domain_id: 1
        peer_switch: true
        peer_gateway: true
        auto_recovery: true
        auto_recovery_reload_delay: 360
        delay_restore: 150
        peer_link_port_channel: 500
        keepalive:
          destination_ip: 192.168.255.52
          source_ip: 192.168.255.51
