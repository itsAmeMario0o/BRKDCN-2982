# Device-direct NX-OS automation (no NDFC). Collections install inside the repo
# so nothing lands in the home directory. Connection is NX-API (httpapi), the
# same path the Terraform leg uses, reachable over NX-API (httpapi).
[defaults]
collections_paths = ./collections
inventory         = ./inventory.yml
host_key_checking = False
retry_files_enabled = False
gathering         = explicit

[persistent_connection]
command_timeout = 60
connect_timeout = 60
