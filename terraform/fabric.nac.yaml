# The whole Cilium EVPN fabric as one nac-nxos data model: the single-AS iBGP
# underlay, the vPC leaf pairs, the VXLAN EVPN overlay, and the eBGP peering to
# the Kubernetes nodes. Terraform (CiscoDevNet/nxos, over NX-API) renders and
# applies it, and a plan reports "No changes" against the running fabric.
#
# The design in numbers:
#   AS 65400        one autonomous system; the spines are route-reflectors
#   AS 65001        the Kubernetes cluster, eBGP into the tenant VRF
#   AS 65500        the border firewall, peered on leaf3/4 (left out of this model)
#   loopback0       router-id and BGP source, 10.0.0.x
#   loopback1       the leaf VTEP, 10.0.1.x, with a shared anycast secondary per
#                   vPC pair (.100 on leaf1-2, .101 on leaf3-4) so a pair is one VTEP
#   loopback254     the anycast rendezvous point 10.254.254.254, on both spines
#   VNIs            10050/10051 the k8s segments, 10100/10200 shared, 50000 the L3VNI
#   239.1.1.x       the multicast groups that carry broadcast and unknown traffic
#   0000.0000.1234  the anycast gateway MAC, the same on every leaf
#   tenant1         the tenant VRF; pod CIDRs arrive here as EVPN Type-5 routes


nxos:
  devices:
  # spine1: route-reflector and anycast-RP member
  - name: spine1
    configuration:
      # what features to turn on
      feature:
        bgp: true
        pim: true
        nv_overlay: true
        evpn: true
      interfaces:
        # loopback0 router-id, loopback254 the anycast-RP
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.1/32
          pim:
            sparse_mode: true
        - id: 254
          ip:
            address: 10.254.254.254/32
          pim:
            sparse_mode: true
        # L3 links down to the leaves, mtu 9216 for VXLAN headroom
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.0/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.2/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/3
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.4/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/4
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.6/31
          pim:
            sparse_mode: true
          mtu: 9216
      # BGP: single-AS iBGP underlay, spines reflecting l2vpn evpn
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.1
          address_families:
          - address_family: ipv4-unicast
            networks:
            - prefix: 10.0.0.1/32
            - prefix: 10.1.1.0/31
            - prefix: 10.1.1.2/31
            - prefix: 10.1.1.4/31
            - prefix: 10.1.1.6/31
            - prefix: 10.254.254.254/32
          - address_family: l2vpn-evpn
            retain_route_target_all: true
          neighbors:
          - ip: 10.1.1.1
            remote_as: '65400'
            description: leaf1
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.1.3
            remote_as: '65400'
            description: leaf2
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.1.5
            remote_as: '65400'
            description: leaf3
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.1.7
            remote_as: '65400'
            description: leaf4
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.0.0.11
            remote_as: '65400'
            description: leaf1-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
          - ip: 10.0.0.12
            remote_as: '65400'
            description: leaf2-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
          - ip: 10.0.0.13
            remote_as: '65400'
            description: leaf3-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
          - ip: 10.0.0.14
            remote_as: '65400'
            description: leaf4-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
          anycast_rps:
          - address: 10.254.254.254
            set_address: 10.0.0.1
          - address: 10.254.254.254
            set_address: 10.0.0.2
  # spine2: route-reflector and anycast-RP member
  - name: spine2
    configuration:
      # what features to turn on
      feature:
        bgp: true
        pim: true
        nv_overlay: true
        evpn: true
      interfaces:
        # loopback0 router-id, loopback254 the anycast-RP
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.2/32
          pim:
            sparse_mode: true
        - id: 254
          ip:
            address: 10.254.254.254/32
          pim:
            sparse_mode: true
        # L3 links down to the leaves, mtu 9216 for VXLAN headroom
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.0/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.2/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/3
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.4/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/4
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.6/31
          pim:
            sparse_mode: true
          mtu: 9216
      # BGP: single-AS iBGP underlay, spines reflecting l2vpn evpn
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.2
          address_families:
          - address_family: ipv4-unicast
            networks:
            - prefix: 10.0.0.2/32
            - prefix: 10.1.2.0/31
            - prefix: 10.1.2.2/31
            - prefix: 10.1.2.4/31
            - prefix: 10.1.2.6/31
            - prefix: 10.254.254.254/32
          - address_family: l2vpn-evpn
            retain_route_target_all: true
          neighbors:
          - ip: 10.1.2.1
            remote_as: '65400'
            description: leaf1
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.2.3
            remote_as: '65400'
            description: leaf2
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.2.5
            remote_as: '65400'
            description: leaf3
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.1.2.7
            remote_as: '65400'
            description: leaf4
            address_families:
            - address_family: ipv4-unicast
              route_reflector_client: true
          - ip: 10.0.0.11
            remote_as: '65400'
            description: leaf1-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
          - ip: 10.0.0.12
            remote_as: '65400'
            description: leaf2-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
          - ip: 10.0.0.13
            remote_as: '65400'
            description: leaf3-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
          - ip: 10.0.0.14
            remote_as: '65400'
            description: leaf4-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
              route_reflector_client: true
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
          anycast_rps:
          - address: 10.254.254.254
            set_address: 10.0.0.1
          - address: 10.254.254.254
            set_address: 10.0.0.2
  # leaf1: VTEP, vPC member, and cluster peer
  - name: leaf1
    configuration:
      # what features to turn on
      feature:
        bgp: true
        pim: true
        vpc: true
        nv_overlay: true
        vn_segment_vlan_based: true
        interface_vlan: true
        evpn: true
      interfaces:
        # loopback0 router-id, loopback1 the VTEP with the pair's anycast secondary
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.11/32
          pim:
            sparse_mode: true
        - id: 1
          ip:
            address: 10.0.1.11/32
            secondary_addresses:
            - address: 10.0.1.100/32
          pim:
            sparse_mode: true
        # L3 uplinks to the spines (mtu 9216), and the vPC member ports (Eth1/3 peer-link, Eth1/4 host)
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.1/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.1/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/3
          channel_group: 500
          channel_group_mode: active
        - id: 1/4
          channel_group: 10
        port_channels:
        - id: 500
          switchport:
            mode: trunk
            trunk_allowed_vlans: 50,100,200,2001
        - id: 10
          vpc_id: 10
          switchport:
            mode: access
            access_vlan: 50
        # the VTEP: VXLAN source on loopback1, L2VNIs with multicast BUM, the L3VNI
        nve:
          source_interface_type: loopback
          source_interface_id: 1
          host_reachability_protocol: bgp
          advertise_virtual_rmac: true
          vnis:
          - vni: 10050
            mcast_group: 239.1.1.50
          - vni: 10100
            mcast_group: 239.1.1.100
          - vni: 10200
            mcast_group: 239.1.1.200
          - vni: 50000
            associate_vrf: true
        # anycast gateways: the same SVI address on every leaf, so a host keeps its gateway anywhere
        vlans:
        - id: 50
          vrf: tenant1
          ip:
            address: 10.0.50.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 100
          vrf: tenant1
          ip:
            address: 10.0.100.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 200
          vrf: tenant1
          ip:
            address: 10.0.200.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 2001
          vrf: tenant1
          ip:
            forward: true
      # BGP: iBGP underlay, l2vpn-evpn to the spines, and the tenant-VRF eBGP to the cluster
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.11
          address_families:
          - address_family: ipv4-unicast
            networks:
            - prefix: 10.0.0.11/32
            - prefix: 10.0.1.11/32
            - prefix: 10.0.1.100/32
          - address_family: l2vpn-evpn
          neighbors:
          - ip: 10.1.1.0
            remote_as: '65400'
            description: spine1
            address_families:
            - address_family: ipv4-unicast
          - ip: 10.1.2.0
            remote_as: '65400'
            description: spine2
            address_families:
            - address_family: ipv4-unicast
          - ip: 10.0.0.1
            remote_as: '65400'
            description: spine1-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
          - ip: 10.0.0.2
            remote_as: '65400'
            description: spine2-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
          vrfs:
          - vrf: tenant1
            address_families:
            - address_family: ipv4-unicast
              advertise_l2vpn_evpn: true
              maximum_paths: 8
              redistributions:
              - protocol: direct
                route_map: RM-REDIST-DIRECT
            neighbors:
            - ip: 10.0.50.11
              remote_as: '65001'
              description: cilium-node
              address_families:
              - address_family: ipv4-unicast
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
      # the vPC pair: peer-link Po500 and keepalive over mgmt, so two leaves act as one
      vpc:
        domain_id: 1
        peer_switch: true
        peer_gateway: true
        auto_recovery: true
        auto_recovery_reload_delay: 360
        delay_restore: 150
        peer_link_port_channel: 500
        keepalive:
          destination_ip: 192.168.255.52
          source_ip: 192.168.255.51
          vrf: management
      fabric_forwarding:
        anycast_gateway_mac: 00:00:00:00:12:34
      # which VLAN maps to which VXLAN VNI
      vlan:
        # anycast gateways: the same SVI address on every leaf, so a host keeps its gateway anywhere
        vlans:
        - id: 50
          vn_segment: 10050
        - id: 100
          vn_segment: 10100
        - id: 200
          vn_segment: 10200
        - id: 2001
          vn_segment: 50000
      # the tenant VRF and its L3VNI 50000
      vrfs:
      - name: tenant1
        vni: 50000
        route_distinguisher: auto
        address_families:
        - address_family: ipv4-unicast
          route_target_both_auto: true
          route_target_both_auto_evpn: true
      # L2VNI route-targets, auto-derived from the AS and VNI
      evpn:
        vnis:
        - vni: 10050
          rd: auto
          route_target_both_auto: true
        - vni: 10100
          rd: auto
          route_target_both_auto: true
        - vni: 10200
          rd: auto
          route_target_both_auto: true
      # permit-all map for redistributing the pod routes into BGP
      route_maps:
      - name: RM-REDIST-DIRECT
        entries:
        - order: 10
          action: permit
  # leaf2: VTEP, vPC member, and cluster peer
  - name: leaf2
    configuration:
      # what features to turn on
      feature:
        bgp: true
        pim: true
        vpc: true
        nv_overlay: true
        vn_segment_vlan_based: true
        interface_vlan: true
        evpn: true
      interfaces:
        # loopback0 router-id, loopback1 the VTEP with the pair's anycast secondary
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.12/32
          pim:
            sparse_mode: true
        - id: 1
          ip:
            address: 10.0.1.12/32
            secondary_addresses:
            - address: 10.0.1.100/32
          pim:
            sparse_mode: true
        # L3 uplinks to the spines (mtu 9216), and the vPC member ports (Eth1/3 peer-link, Eth1/4 host)
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.3/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.3/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/3
          channel_group: 500
          channel_group_mode: active
        - id: 1/4
          channel_group: 10
        port_channels:
        - id: 500
          switchport:
            mode: trunk
            trunk_allowed_vlans: 50,100,200,2001
        - id: 10
          vpc_id: 10
          switchport:
            mode: access
            access_vlan: 50
        # the VTEP: VXLAN source on loopback1, L2VNIs with multicast BUM, the L3VNI
        nve:
          source_interface_type: loopback
          source_interface_id: 1
          host_reachability_protocol: bgp
          advertise_virtual_rmac: true
          vnis:
          - vni: 10050
            mcast_group: 239.1.1.50
          - vni: 10100
            mcast_group: 239.1.1.100
          - vni: 10200
            mcast_group: 239.1.1.200
          - vni: 50000
            associate_vrf: true
        # anycast gateways: the same SVI address on every leaf, so a host keeps its gateway anywhere
        vlans:
        - id: 50
          vrf: tenant1
          ip:
            address: 10.0.50.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 100
          vrf: tenant1
          ip:
            address: 10.0.100.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 200
          vrf: tenant1
          ip:
            address: 10.0.200.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 2001
          vrf: tenant1
          ip:
            forward: true
      # BGP: iBGP underlay, l2vpn-evpn to the spines, and the tenant-VRF eBGP to the cluster
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.12
          address_families:
          - address_family: ipv4-unicast
            networks:
            - prefix: 10.0.0.12/32
            - prefix: 10.0.1.12/32
            - prefix: 10.0.1.100/32
          - address_family: l2vpn-evpn
          neighbors:
          - ip: 10.1.1.2
            remote_as: '65400'
            description: spine1
            address_families:
            - address_family: ipv4-unicast
          - ip: 10.1.2.2
            remote_as: '65400'
            description: spine2
            address_families:
            - address_family: ipv4-unicast
          - ip: 10.0.0.1
            remote_as: '65400'
            description: spine1-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
          - ip: 10.0.0.2
            remote_as: '65400'
            description: spine2-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
          vrfs:
          - vrf: tenant1
            address_families:
            - address_family: ipv4-unicast
              advertise_l2vpn_evpn: true
              maximum_paths: 8
              redistributions:
              - protocol: direct
                route_map: RM-REDIST-DIRECT
            neighbors:
            - ip: 10.0.50.11
              remote_as: '65001'
              description: cilium-node
              address_families:
              - address_family: ipv4-unicast
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
      # the vPC pair: peer-link Po500 and keepalive over mgmt, so two leaves act as one
      vpc:
        domain_id: 1
        peer_switch: true
        peer_gateway: true
        auto_recovery: true
        auto_recovery_reload_delay: 360
        delay_restore: 150
        peer_link_port_channel: 500
        keepalive:
          destination_ip: 192.168.255.51
          source_ip: 192.168.255.52
          vrf: management
      fabric_forwarding:
        anycast_gateway_mac: 00:00:00:00:12:34
      # which VLAN maps to which VXLAN VNI
      vlan:
        # anycast gateways: the same SVI address on every leaf, so a host keeps its gateway anywhere
        vlans:
        - id: 50
          vn_segment: 10050
        - id: 100
          vn_segment: 10100
        - id: 200
          vn_segment: 10200
        - id: 2001
          vn_segment: 50000
      # the tenant VRF and its L3VNI 50000
      vrfs:
      - name: tenant1
        vni: 50000
        route_distinguisher: auto
        address_families:
        - address_family: ipv4-unicast
          route_target_both_auto: true
          route_target_both_auto_evpn: true
      # L2VNI route-targets, auto-derived from the AS and VNI
      evpn:
        vnis:
        - vni: 10050
          rd: auto
          route_target_both_auto: true
        - vni: 10100
          rd: auto
          route_target_both_auto: true
        - vni: 10200
          rd: auto
          route_target_both_auto: true
      # permit-all map for redistributing the pod routes into BGP
      route_maps:
