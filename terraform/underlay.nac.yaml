  - name: leaf4
    configuration:
      feature:
        bgp: true
        pim: true
        vpc: true
        nv_overlay: true
        vn_segment_vlan_based: true
        interface_vlan: true
        evpn: true
      interfaces:
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.14/32
          pim:
            sparse_mode: true
        - id: 1
          ip:
            address: 10.0.1.14/32
            secondary_addresses:
            - address: 10.0.1.101/32
          pim:
            sparse_mode: true
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.7/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.2.7/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/3
          channel_group: 500
          channel_group_mode: active
        - id: 1/4
          channel_group: 10
        port_channels:
        - id: 500
          switchport:
            mode: trunk
            trunk_allowed_vlans: 51,100,200,2001
        - id: 10
          vpc_id: 10
          switchport:
            mode: access
            access_vlan: 51
        nve:
          source_interface_type: loopback
          source_interface_id: 1
          host_reachability_protocol: bgp
          advertise_virtual_rmac: true
          vnis:
          - vni: 10051
            mcast_group: 239.1.1.51
          - vni: 10100
            mcast_group: 239.1.1.100
          - vni: 10200
            mcast_group: 239.1.1.200
          - vni: 50000
            associate_vrf: true
        vlans:
        - id: 51
          vrf: tenant1
          ip:
            address: 10.0.51.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 100
          vrf: tenant1
          ip:
            address: 10.0.100.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 200
          vrf: tenant1
          ip:
            address: 10.0.200.1/24
          fabric_forwarding_mode: anycast-gw
        - id: 2001
          vrf: tenant1
          ip:
            forward: true
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.14
          address_families:
          - address_family: ipv4-unicast
            networks:
            - prefix: 10.0.0.14/32
            - prefix: 10.0.1.14/32
            - prefix: 10.0.1.101/32
          - address_family: l2vpn-evpn
          neighbors:
          - ip: 10.1.1.6
            remote_as: '65400'
            description: spine1
            address_families:
            - address_family: ipv4-unicast
          - ip: 10.1.2.6
            remote_as: '65400'
            description: spine2
            address_families:
            - address_family: ipv4-unicast
          - ip: 10.0.0.1
            remote_as: '65400'
            description: spine1-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
          - ip: 10.0.0.2
            remote_as: '65400'
            description: spine2-evpn
            update_source_interface_type: loopback
            update_source_interface_id: 0
            address_families:
            - address_family: l2vpn-evpn
              send_community_standard: true
              send_community_extended: true
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
      vpc:
        domain_id: 2
        peer_switch: true
        peer_gateway: true
        auto_recovery: true
        auto_recovery_reload_delay: 360
        delay_restore: 150
        peer_link_port_channel: 500
        keepalive:
          destination_ip: 192.168.255.53
          source_ip: 192.168.255.54
          vrf: management
      fabric_forwarding:
        anycast_gateway_mac: "00:00:00:00:12:34"
      vlan:
        vlans:
        - id: 51
          vn_segment: 10051
        - id: 100
          vn_segment: 10100
        - id: 200
          vn_segment: 10200
        - id: 2001
          vn_segment: 50000
      vrfs:
      - name: tenant1
        vni: 50000
        route_distinguisher: auto
        address_families:
        - address_family: ipv4-unicast
          route_target_both_auto: true
          route_target_both_auto_evpn: true
      evpn:
        vnis:
        - vni: 10051
          rd: auto
          route_target_both_auto: true
        - vni: 10100
          rd: auto
          route_target_both_auto: true
        - vni: 10200
          rd: auto
          route_target_both_auto: true
