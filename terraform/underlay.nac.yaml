            ip:
              address: 10.1.2.6/31
        routing:
          bgp:
            asn: "65400"
            router_id: 10.0.0.2
            address_families:
            - address_family: ipv4-unicast
              networks:
              - prefix: 10.0.0.2/32
              - prefix: 10.1.2.0/31
              - prefix: 10.1.2.2/31
              - prefix: 10.1.2.4/31
              - prefix: 10.1.2.6/31
            neighbors:
            - ip: 10.1.2.1
              remote_as: "65400"
              description: leaf1
              address_families:
              - address_family: ipv4-unicast
                route_reflector_client: true
            - ip: 10.1.2.3
              remote_as: "65400"
