              route_reflector_client: true
        pim:
          rps:
          - address: 10.254.254.254
            group_lists:
            - group_list: 239.0.0.0/8
          anycast_rps:
          - address: 10.254.254.254
            set_address: 10.0.0.1
          - address: 10.254.254.254
            set_address: 10.0.0.2
