# The demo namespace and its three tiers. All three run the same image
# (build it from ./app) with a different ROLE. Build and load it onto the
# cluster before applying: see this folder's README.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels: { app: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: app
          image: connectivity-tester:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: frontend }
            - { name: PORT, value: "8080" }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  selector: { app: frontend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
  labels: { app: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: app
          image: connectivity-tester:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: backend }
            - { name: PORT, value: "8081" }
          ports: [{ containerPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
spec:
  selector: { app: backend }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: demo
  labels: { app: database }
spec:
  replicas: 1
  selector: { matchLabels: { app: database } }
  template:
    metadata:
      labels: { app: database }
    spec:
      containers:
        - name: app
          image: connectivity-tester:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: database }
            - { name: PORT, value: "5432" }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: demo
spec:
  selector: { app: database }
  ports: [{ port: 5432, targetPort: 5432 }]
