<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectivity tester</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  button { display: block; width: 100%; text-align: left; margin: .4rem 0; padding: .6rem .8rem;
           border: 1px solid #ccc; border-radius: 6px; background: #fafafa; cursor: pointer; font-size: .95rem; }
  button:hover { background: #f0f0f0; }
  .r { font-family: ui-monospace, monospace; font-size: .85rem; padding: .2rem .5rem; border-radius: 4px; }
  .ok { color: #0a7d32; } .no { color: #b00020; } .muted { color: #777; }
</style>
</head>
<body>
<h1>Connectivity tester</h1>
<p class="muted">Each button runs one probe from inside this pod. Green is reachable, red is blocked. Apply the policies in order and watch the results change.</p>
<div id="checks"></div>
<script>
  const checks = [
    { label: "DNS: resolve backend",            q: "type=dns&target=backend" },
    { label: "TCP: backend:8081",               q: "type=tcp&target=backend&port=8081" },
    { label: "HTTP GET backend:8081/api/health", q: "type=http&target=backend&port=8081&path=/api/health" },
    { label: "HTTP GET backend:8081/private",    q: "type=http&target=backend&port=8081&path=/private" },
    { label: "TCP: database:5432",              q: "type=tcp&target=database&port=5432" },
    { label: "HTTPS: api.github.com",           q: "type=https&target=api.github.com&path=/" },
  ];
  const root = document.getElementById("checks");
  for (const c of checks) {
    const b = document.createElement("button");
    const out = document.createElement("span");
    out.className = "r muted"; out.textContent = "not run";
    b.textContent = c.label;
    b.onclick = async () => {
      out.textContent = "running..."; out.className = "r muted";
      try {
        const res = await fetch("/check?" + c.q);
        const j = await res.json();
        out.textContent = (j.ok ? "OK  " : "BLOCKED  ") + j.detail;
        out.className = "r " + (j.ok ? "ok" : "no");
      } catch (e) {
        out.textContent = "error " + e; out.className = "r no";
      }
    };
    const row = document.createElement("div");
    row.appendChild(b); row.appendChild(out);
    root.appendChild(row);
  }
</script>
</body>
</html>
