        - id: 1/4
          channel_group: 10
        port_channels:
        - id: 500
          switchport:
            mode: trunk
            trunk_allowed_vlans: 50,100,200,2001
        - id: 10
          vpc_id: 10
          switchport:
            mode: access
            access_vlan: 50
      routing:
        bgp:
          asn: '65400'
          router_id: 10.0.0.11
