  # leaf3: VTEP, vPC member, and cluster peer
  - name: leaf3
    configuration:
      # what features to turn on
      feature:
        bgp: true
        pim: true
        vpc: true
        nv_overlay: true
        vn_segment_vlan_based: true
        interface_vlan: true
        evpn: true
      interfaces:
        # loopback0 router-id, loopback1 the VTEP with the pair's anycast secondary
        loopbacks:
        - id: 0
          ip:
            address: 10.0.0.13/32
          pim:
            sparse_mode: true
        - id: 1
          ip:
            address: 10.0.1.13/32
            secondary_addresses:
            - address: 10.0.1.101/32
          pim:
            sparse_mode: true
        # L3 uplinks to the spines (mtu 9216), and the vPC member ports (Eth1/3 peer-link, Eth1/4 host)
        ethernets:
        - id: 1/1
          shutdown: false
          switchport:
            enabled: false
          ip:
            address: 10.1.1.5/31
          pim:
            sparse_mode: true
          mtu: 9216
        - id: 1/2
          shutdown: false
          switchport:
