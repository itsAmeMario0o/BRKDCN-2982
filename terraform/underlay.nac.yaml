              address_families:
              - address_family: ipv4-unicast
                route_reflector_client: true
    - name: leaf1
      configuration:
        feature:
          bgp: true
        interfaces:
          loopbacks:
          - id: 0
            ip:
              address: 10.0.0.11/32
          - id: 1
