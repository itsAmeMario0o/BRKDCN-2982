apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
  labels:
    app: demo
spec:
  replicas: 2
  # Recreate, not RollingUpdate: with strict one-per-node anti-affinity on a
  # 2-node cluster there is no spare node to surge onto, so a rolling update
  # deadlocks. Recreate tears down old pods first, then schedules new ones.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: demo
              topologyKey: kubernetes.io/hostname
      # One replica must land on the control-plane node to achieve one-per-node
      # on this 2-node kind cluster; tolerate its NoSchedule taint.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
