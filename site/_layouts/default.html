<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07182D">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/design-system/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    {% include header.html %}

    <main class="page" id="main">
      <article class="prose">
        {% if page.title and page.hide_page_header != true %}
          <header class="page-header">
            <p class="eyebrow">{{ page.eyebrow | default: "Documentation" }}</p>
            <h1>{{ page.title }}</h1>
            {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
          </header>
        {% endif %}

        {{ content }}
      </article>
    </main>

    {% include footer.html %}
  </body>
</html>
